<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TURBO THREADS | Private Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-page{min-height:100vh;padding:120px 24px 60px;max-width:1500px;margin:auto}
    .admin-login,.admin-panel{max-width:1200px;margin:auto;background:rgba(15,15,17,.94);border:1px solid var(--border-color);border-radius:24px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
    .admin-login{max-width:480px;margin-top:8vh;text-align:center}.admin-login h1,.admin-panel h1{margin-bottom:8px}.admin-sub{color:var(--text-muted);margin-bottom:24px}
    .admin-form{display:grid;gap:14px}.admin-form input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border-color);background:#09090b;color:#fff}
    .admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}
    .admin-btn{border:1px solid var(--border-color);background:#111113;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800}.admin-btn.primary{background:var(--red-accent);border-color:var(--red-accent);color:#fff}.admin-btn:hover{filter:brightness(1.12)}
    .orders-grid{display:grid;gap:15px}.order-card{background:#0b0b0e;border:1px solid #242428;border-radius:18px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.order-id{font-weight:900;color:var(--red-accent)}.order-meta{color:var(--text-muted);font-size:13px}.order-customer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.order-customer div{background:#111114;border-radius:10px;padding:10px}.order-customer small{display:block;color:#777;margin-bottom:4px}.order-items{border-top:1px solid #242428;padding-top:14px}.order-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;color:#ddd}.order-total{display:flex;justify-content:flex-end;gap:14px;margin-top:15px;font-size:18px}.status-select{background:#111114;color:#fff;border:1px solid #333;border-radius:9px;padding:8px}.empty-admin{text-align:center;color:var(--text-muted);padding:40px}
    @media(max-width:1050px){.order-customer{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.admin-page{padding:100px 12px 30px}.admin-top{align-items:flex-start;flex-direction:column}.order-customer{grid-template-columns:1fr}.order-head{flex-direction:column}.order-total{justify-content:flex-start;flex-wrap:wrap}.order-address{word-break:break-word}}
  </style>
</head>
<body>
<header class="navbar"><div class="nav-container"><a href="index.html" class="logo">TURBO <span>THREADS</span></a><div class="nav-right"><a class="admin-btn" href="index.html">Store</a></div></div></header>
<main class="admin-page">
  <section id="login-card" class="admin-login">
    <span class="details-badge">PRIVATE CONTROL PANEL</span><h1>Owner Dashboard</h1><p class="admin-sub">Sign in with your Supabase admin account to see orders.</p>
    <form id="login-form" class="admin-form"><input id="admin-email" type="email" required placeholder="Admin email" autocomplete="username"><input id="admin-password" type="password" required placeholder="Admin password" autocomplete="current-password"><button class="admin-btn primary" type="submit">UNLOCK ORDERS</button><p id="login-error" class="admin-sub"></p></form>
  </section>
  <section id="panel" class="admin-panel" hidden>
    <div class="admin-top"><div><span class="details-badge">PRIVATE ORDERS</span><h1>Turbo Threads Orders</h1><p id="order-count" class="admin-sub">0 orders</p></div><div class="admin-actions"><button id="refresh" class="admin-btn">Refresh</button><button id="logout" class="admin-btn">Logout</button></div></div>
    <div id="orders" class="orders-grid"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>`${Number(v||0).toLocaleString('en-US')} EGP`;
const statuses=['new','confirmed','shipped','delivered','cancelled'];
const db=window.supabase.createClient(window.TURBO_CONFIG.supabaseUrl,window.TURBO_CONFIG.supabaseAnonKey);
async function loadOrders(){const{data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){alert('Could not load orders: '+error.message);return}if(!data.length){const{data:isAdmin}=await db.rpc('is_admin');if(!isAdmin){await db.auth.signOut();showLogin();$('#login-error').textContent='This account is not an admin.';return}}render(data)}
function render(orders){$('#order-count').textContent=`${orders.length} order${orders.length===1?'':'s'}`;const root=$('#orders');root.innerHTML='';if(!orders.length){root.innerHTML='<div class="empty-admin">No orders yet. New website orders will appear here.</div>';return}orders.forEach(o=>{const card=document.createElement('article');card.className='order-card';const items=(o.items||[]).map(i=>`<div class="order-item"><span>${esc(i.name)} · ${esc(i.size)} × ${esc(i.quantity)}</span><strong>${money(i.price*i.quantity)}</strong></div>`).join('');card.innerHTML=`<div class="order-head"><div><div class="order-id">#${esc(String(o.id).slice(0,8).toUpperCase())}</div><div class="order-meta">${new Date(o.created_at).toLocaleString()} · ${o.channel==='whatsapp'?'WhatsApp':'Website'}</div></div><select class="status-select" data-id="${esc(o.id)}">${statuses.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s.toUpperCase()}</option>`).join('')}</select></div><div class="order-customer"><div><small>Name</small>${esc(o.full_name)}</div><div><small>Phone</small><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div><div><small>Governorate</small>${esc(o.governorate)}</div><div class="order-address"><small>Detailed address</small>${esc(o.address||'—')}</div></div><div class="order-items">${items}</div><div class="order-total"><span>Subtotal ${money(o.subtotal)}</span><span>Shipping ${money(o.shipping)}</span><strong>${money(o.total)}</strong></div>`;root.appendChild(card)});root.querySelectorAll('.status-select').forEach(s=>s.addEventListener('change',async e=>{const{error}=await db.from('orders').update({status:e.target.value}).eq('id',e.target.dataset.id);if(error){alert('Could not update status: '+error.message);loadOrders()}}))}
function showPanel(){$('#login-card').hidden=true;$('#panel').hidden=false;loadOrders()}
function showLogin(){$('#login-card').hidden=false;$('#panel').hidden=true}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';const{error}=await db.auth.signInWithPassword({email:$('#admin-email').value.trim(),password:$('#admin-password').value});if(error){$('#login-error').textContent=error.message;return}$('#admin-password').value='';showPanel()});
$('#refresh').addEventListener('click',loadOrders);$('#logout').addEventListener('click',async()=>{await db.auth.signOut();showLogin()});
db.auth.getSession().then(({data})=>{if(data.session)showPanel();else showLogin()});
</script>
</body></html>
